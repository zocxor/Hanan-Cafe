name: Build Hanan Cafe from zip

on:
  workflow_dispatch: {}

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find and unzip the kit
        shell: pwsh
        run: |
          $found = $false
          foreach ($z in Get-ChildItem -Path . -Filter *.zip) {
            Write-Host "Checking $($z.Name)"
            $dest = "kit_" + $z.BaseName
            Expand-Archive -Path $z.FullName -DestinationPath $dest -Force
            $bat = Get-ChildItem -Path $dest -Recurse -Filter build_windows_exe.bat | Select-Object -First 1
            if ($bat) {
              Write-Host "Using $($z.Name) -> $($bat.DirectoryName)"
              "KIT_DIR=$($bat.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $found = $true
              break
            }
          }
          if (-not $found) { Write-Error "No zip contains build_windows_exe.bat."; exit 1 }
      - name: Build exe
        shell: cmd
        working-directory: ${{ env.KIT_DIR }}
        run: build_windows_exe.bat
      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item "$env:KIT_DIR\dist\HananCafe-Windows.zip" out\
      - uses: actions/upload-artifact@v4
        with:
          name: HananCafe-Windows
          path: out/HananCafe-Windows.zip

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip the kit
        run: |
          found=""
          for z in *.zip; do
            echo "Checking $z"
            mkdir -p "kit_$z"
            unzip -q "$z" -d "kit_$z"
            s=$(find "kit_$z" -path "*/android/settings.gradle" | head -1)
            if [ -n "$s" ]; then
              echo "ANDROID_DIR=$(dirname "$s")" >> "$GITHUB_ENV"
              echo "Using $z"
              found=1
              break
            fi
          done
          if [ -z "$found" ]; then echo "No zip contains the android project."; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle assembleRelease --no-daemon
      - name: Collect output
        run: |
          mkdir -p out
          cp "$ANDROID_DIR"/app/build/outputs/apk/release/*.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: HananCafe-Android-APK
          path: out/*.apk
